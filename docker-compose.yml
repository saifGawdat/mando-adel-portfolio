services:
  db:
    image: postgres:16-alpine
    container_name: mando-adel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mando
      POSTGRES_PASSWORD: mando
      POSTGRES_DB: mando_adel
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mando -d mando_adel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
